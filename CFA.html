<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFA Level I · 十科教材与考点工作台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===== 设计令牌：模拟卷纸 + 墨蓝 + 荧光笔 ===== */
:root{
  --paper:#F1EEE3;
  --paper-2:#FAF8F0;
  --paper-3:#E9E5D6;
  --ink:#20241F;
  --ink-2:#4E544B;
  --ink-3:#7C8175;
  --line:#DAD5C4;
  --line-2:#C8C2AE;
  --navy:#12324A;
  --navy-2:#0C2436;
  --navy-3:#1C4560;
  --marker:#E4BE3A;
  --marker-soft:#F6E7A8;
  --good:#2B6A52;
  --good-soft:#DCE9DF;
  --bad:#AF4530;
  --bad-soft:#F2DDD6;
  --shadow:0 1px 0 rgba(32,36,31,.05),0 12px 28px -18px rgba(18,50,74,.35);
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --disp:"Archivo","Noto Sans SC",sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::selection{background:var(--marker-soft)}
:focus-visible{outline:2px solid var(--navy-3);outline-offset:2px}

/* ===== 布局：左侧深色书脊 / 右侧卷面 ===== */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;
  background:var(--navy-2);
  color:#E8E9E0;
  display:flex;flex-direction:column;
  padding:26px 20px 18px;
  overflow-y:auto;
  border-right:1px solid rgba(0,0,0,.25);
}
.brand{display:flex;flex-direction:column;gap:6px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-en{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1}
.brand-sub{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#94A6B0;font-family:var(--mono)}
.rail-count{
  display:flex;align-items:flex-end;gap:8px;
  margin:18px 0 4px;
}
.rail-count b{font-family:var(--mono);font-size:40px;font-weight:600;color:#fff;line-height:1;letter-spacing:-.02em}
.rail-count span{font-size:12px;color:#9DB0BA;line-height:1.4;padding-bottom:2px}
.rail-note{font-size:11.5px;color:#8398A4;font-family:var(--mono)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.nav a{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:6px;
  font-size:14px;color:#B9C7CE;
  border-left:2px solid transparent;
}
.nav a .dot{width:5px;height:5px;border-radius:50%;background:#4E6C7C;flex:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(228,190,58,.14);color:#fff;border-left-color:var(--marker)}
.nav a.on .dot{background:var(--marker)}
.nav a.weak{color:#F0DCA0}
.nav-grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#5C7A8B;margin:14px 0 4px;padding-left:11px}
.nav a.sub{font-size:12px;padding:5px 11px;color:#C7D4DC}
.nav a.sub em{font-family:var(--mono);font-style:normal;font-size:9.5px;color:#5C7A8B;margin-left:auto;padding-left:8px}
.nav a.sub.on em{color:var(--marker)}


/* 考前冲刺包 */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:12px}
.cmodel{border:1px solid var(--line);background:var(--paper-2);border-radius:3px;padding:14px 15px 12px;box-shadow:var(--shadow)}
.cmodel-h{display:flex;gap:9px;align-items:baseline}
.cmodel-h span{font-family:var(--mono);font-size:9.5px;color:var(--marker);background:var(--navy);padding:1px 5px;border-radius:2px;flex:none}
.cmodel h4{font-size:13.5px;margin:0;line-height:1.45}
.cmodel h4 em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-left:5px}
.cmodel ol{margin:8px 0 0;padding-left:16px;font-size:11.8px;line-height:1.8;color:var(--ink-2)}
.cmodel .ex{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:10.5px;color:var(--navy)}
.pair-table{width:100%;border-collapse:collapse}
.pair-table td{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.3px;color:var(--ink-2);line-height:1.6;vertical-align:top}
.pair-table td.ab{width:40%;padding-right:16px}
.pair-table td.ab b{font-size:12.3px;color:var(--ink)}
.pair-table td.ab span{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin:0 7px}
.stem{display:grid;grid-template-columns:minmax(200px,.85fr) minmax(0,1.15fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.stem:last-child{border-bottom:0}
.stem .q{font-family:var(--mono);font-size:11.5px;color:var(--navy)}
.stem p{margin:0;font-size:12.3px;color:var(--ink-2);line-height:1.7}

/* 单科教材页 */
.crumb{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-bottom:12px}
.crumb a{color:var(--navy);border-bottom:1px solid var(--line-2)}
.subj-hero{border:1px solid var(--line);background:var(--paper-2);border-radius:4px;padding:22px 24px 20px;box-shadow:var(--shadow);position:relative}
.subj-hero .en-h{font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.metrics div{background:var(--paper);padding:11px 13px}
.metrics b{display:block;font-family:var(--mono);font-size:19px;color:var(--navy);line-height:1.1}
.metrics span{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2)}
.chain .step{font-size:11.5px;color:var(--ink-2);border:1px solid var(--line-2);background:var(--paper);padding:5px 9px;border-radius:2px}
.chain .step b{font-family:var(--mono);color:var(--navy);font-size:10px;margin-right:5px}
.chain .ar{color:var(--ink-3);font-size:11px;padding:0 5px}
.notes-sec{margin-top:10px}
.note{padding:20px 0 18px;border-bottom:1px dashed var(--line-2)}
.note-h{display:flex;gap:11px;align-items:baseline;margin-bottom:6px}
.note-h .no{font-family:var(--mono);font-size:11px;color:var(--marker);background:var(--navy);padding:2px 6px;border-radius:2px;flex:none}
.note h3{font-family:var(--display);font-size:16px;margin:0;color:var(--ink)}
.note h3 em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:7px;font-weight:400}
.note p{font-size:13px;line-height:1.9;color:var(--ink-2);margin:5px 0 0;max-width:88ch}
.keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.key{font-family:var(--mono);font-size:10.5px;background:#EAE5D2;border:1px solid var(--line);padding:2px 6px;border-radius:2px;color:var(--navy)}
.sec-h{font-family:var(--display);font-size:20px;margin:34px 0 10px;color:var(--ink);letter-spacing:-.01em}
.sec-h em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:8px;letter-spacing:0}
.must{margin:8px 0 0;padding-left:20px}
.must li{font-size:13px;line-height:1.95;color:var(--ink-2)}
.gloss .grow{display:grid;grid-template-columns:minmax(160px,.62fr) minmax(0,1.38fr);gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.gloss .grow:last-of-type{border-bottom:0}
.gloss b{font-size:12.5px;color:var(--ink)}
.gloss span{font-size:11.5px;color:var(--ink-3);margin-left:7px}
.gloss p{font-size:12px;color:var(--ink-2);margin:0;line-height:1.7}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px;margin-top:12px}
.subj-tile{display:block;border:1px solid var(--line);background:var(--paper-2);padding:15px 16px 13px;border-radius:3px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.subj-tile:hover{border-color:var(--navy);transform:translateY(-1px)}
.st-no{font-family:var(--mono);font-size:10px;color:var(--marker);background:var(--navy);padding:2px 6px;border-radius:2px}
.subj-tile h3{font-family:var(--display);font-size:15px;margin:9px 0 4px;color:var(--ink)}
.subj-tile h3 em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-left:5px}
.subj-tile p{font-size:11.8px;line-height:1.7;color:var(--ink-2);margin:0;min-height:58px}
.st-meta{display:block;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:10px;color:var(--ink-3)}
@media (max-width:768px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .gloss .grow{grid-template-columns:1fr;gap:3px}
}
.rail-foot{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:#7E929E;line-height:1.6}
.rail-foot b{color:#D9E2E7;font-family:var(--mono);font-weight:500}

.main{padding:44px 52px 90px;max-width:1240px;width:100%;min-width:0}
.menu-btn{
  display:none;position:fixed;right:16px;bottom:16px;z-index:40;
  width:48px;height:48px;border-radius:50%;
  background:var(--navy);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);
  align-items:center;justify-content:center;
}
.scrim{display:none}

/* ===== 通用排版 ===== */
.kicker{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--navy-3);display:flex;align-items:center;gap:10px;
}
.kicker::before{content:"";width:22px;height:2px;background:var(--marker);display:block}
h1.page{font-size:clamp(30px,3.4vw,44px);letter-spacing:-.02em;margin:10px 0 8px;font-weight:900}
.lede{color:var(--ink-2);font-size:15px;max-width:66ch;line-height:1.75}
.mark{background:linear-gradient(transparent 58%,var(--marker-soft) 58%,var(--marker-soft) 92%,transparent 92%);padding:0 2px}
.mono{font-family:var(--mono)}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.divider{height:1px;background:var(--line);margin:30px 0}

.card{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:4px;
  box-shadow:var(--shadow);
}
.card-pad{padding:24px 24px 22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.card-head h3{font-size:16.5px;letter-spacing:-.01em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ===== Hero 倒计时 ===== */
.hero{
  display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;
  border:1px solid var(--line);background:var(--paper-2);box-shadow:var(--shadow);
  border-radius:4px;overflow:hidden;
}
.hero-l{padding:34px 34px 30px;border-right:1px dashed var(--line-2);position:relative}
.hero-l::after{
  content:"";position:absolute;right:14px;top:0;bottom:0;width:6px;
  background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 14px);opacity:.7;
}
.hero-r{padding:30px 30px 28px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#F7F4E9,var(--paper-2))}
.big-days{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.big-days b{font-family:var(--mono);font-weight:600;font-size:clamp(64px,9vw,104px);line-height:.86;letter-spacing:-.05em;color:var(--navy)}
.big-days span{font-size:15px;color:var(--ink-2);letter-spacing:.04em}
.exam-date{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--ink-2)}
.exam-date input{
  font-family:var(--mono);font-size:13px;padding:6px 8px;border:1px solid var(--line-2);
  background:#fff;border-radius:3px;color:var(--ink);
}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:10px;background:var(--paper-2);border-radius:50%;border:1px solid var(--line)}
.ring span{position:relative;z-index:2;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.03em}
.ring small{position:relative;z-index:2;display:block;font-size:10px;letter-spacing:.12em;color:var(--ink-3);text-align:center;font-family:var(--mono)}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring-txt{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.ring-txt b{font-family:var(--mono);color:var(--ink);font-weight:600}

.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.mini-stats div{background:var(--paper-2);padding:12px 12px 10px}
.mini-stats b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.2}
.mini-stats span{font-size:11px;color:var(--ink-3);letter-spacing:.03em}

/* ===== 科目权重条 ===== */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:132px minmax(0,1fr) 58px;gap:12px;align-items:center;font-size:13px}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:9px;background:var(--paper-3);border-radius:1px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--navy-3)}
.bar-row.weak .nm{color:var(--bad);font-weight:500}
.bar-row.weak .bar-fill{background:var(--bad)}
.bar-row.top .bar-fill{background:var(--navy)}
.bar-row .pc{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right}

/* ===== 按钮 / 芯片 ===== */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:3px;
  background:var(--navy);color:#fff;font-size:13.5px;font-weight:500;
  border:1px solid var(--navy);transition:background .16s ease,transform .16s ease;
}
.btn:hover{background:var(--navy-3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--paper-3)}
.btn.marker{background:var(--marker);border-color:var(--marker);color:#2A2410}
.btn.marker:hover{filter:brightness(.96)}
.btn.sm{padding:6px 11px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:6px 12px;font-size:12.5px;border:1px solid var(--line-2);
  border-radius:20px;color:var(--ink-2);background:transparent;
}
.chip:hover{border-color:var(--navy-3);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border:1px solid var(--line-2);
  border-radius:2px;color:var(--ink-2);background:var(--paper-2);white-space:nowrap;
}
.tag.hot{border-color:#D9B84E;background:var(--marker-soft);color:#5A4610}
.tag.weak{border-color:#D8A79A;background:var(--bad-soft);color:#7C2E1D}
.tag.ok{border-color:#A8C6B4;background:var(--good-soft);color:#225440}

/* ===== 5 天排期 ===== */
.day{display:grid;grid-template-columns:78px minmax(0,1fr);border:1px solid var(--line);border-radius:4px;background:var(--paper-2);box-shadow:var(--shadow);overflow:hidden}
.day-rail{background:var(--paper-3);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border-right:1px solid var(--line)}
.day-rail .dnum{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;color:var(--navy)}
.day-rail .dlbl{font-size:10px;letter-spacing:.12em;color:var(--ink-3);font-family:var(--mono)}
.day-rail .ddate{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:4px}
.day-body{padding:20px 22px 18px}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:4px}
.day-head h3{font-size:17px}
.day-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.tasks{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.task{display:grid;grid-template-columns:26px minmax(0,1fr) 46px;gap:10px;align-items:start;padding:10px 12px;background:var(--paper-2)}
.task:hover{background:#F6F2E3}
.task input{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:2px;margin:3px 0 0;cursor:pointer;background:#fff;position:relative}
.task input:checked{background:var(--navy);border-color:var(--navy)}
.task input:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;
  border-width:0 2px 2px 0;transform:rotate(42deg);
}
.task span.tx{font-size:13.5px;line-height:1.55}
.task input:checked + span.tx{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.task .min{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;padding-top:2px}
.day-progress{height:4px;background:var(--paper-3);margin-top:14px;overflow:hidden}
.day-progress i{display:block;height:100%;background:var(--marker);transition:width .3s ease}

/* ===== 考点库 ===== */
.subj{border:1px solid var(--line);background:var(--paper-2);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.subj-head{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:0;align-items:stretch;cursor:pointer;text-align:left;width:100%}
.subj-bar{background:var(--navy-3)}
.subj.weak .subj-bar{background:var(--bad)}
.subj.hot .subj-bar{background:var(--marker)}
.subj-main{padding:18px 20px 15px}
.subj-main h3{font-size:16.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.subj-main h3 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
.subj-sum{font-size:12.8px;color:var(--ink-2);margin-top:5px;max-width:78ch}
.subj-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;padding:14px 18px;min-width:150px}
.subj-side .w{font-family:var(--mono);font-size:14px;color:var(--navy);font-weight:600}
.subj-side .mp{width:104px;height:4px;background:var(--paper-3);overflow:hidden}
.subj-side .mp i{display:block;height:100%;background:var(--navy-3)}
.subj-body{border-top:1px solid var(--line);padding:4px 20px 20px;display:none}
.subj.open .subj-body{display:block}
.module{margin-top:18px}
.module h4{font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;color:var(--navy);margin-bottom:2px}
.module h4::before{content:"";width:12px;height:2px;background:var(--marker)}
.module h4 em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:400}
.pts{display:flex;flex-direction:column;gap:0;margin-top:8px;border-top:1px solid var(--line)}
.pt{padding:13px 0 13px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.pt h5{font-size:14px;margin:0 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-weight:700}
.pt h5 em{font-style:normal;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--ink-3)}
.pt p{font-size:13px;color:var(--ink-2);line-height:1.7}
.pt .fml{
  font-family:var(--mono);font-size:12px;background:#F5F1DF;border-left:2px solid var(--marker);
  padding:6px 10px;margin-top:7px;color:#3B3520;overflow-x:auto;white-space:nowrap;
}
.pt .trap{font-size:12px;color:#7C2E1D;margin-top:7px;display:flex;gap:7px;line-height:1.6}
.pt .trap b{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.04em;border:1px solid #D8A79A;padding:0 5px;border-radius:2px;height:17px;line-height:15px}
.pt-ctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.dotbtn{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);
  display:grid;place-items:center;background:#fff;flex:none;
}
.dotbtn:hover{border-color:var(--navy-3)}
.dotbtn.on{background:var(--good);border-color:var(--good)}
.dotbtn svg{width:13px;height:13px;stroke:var(--line-2)}
.dotbtn.on svg{stroke:#fff}
.pt-ctl small{font-size:9.5px;font-family:var(--mono);color:var(--ink-3);letter-spacing:.04em}

/* ===== 深度专页 ===== */
.deep-hero{background:var(--navy);color:#EDEEE4;padding:32px 34px;border-radius:4px;position:relative;overflow:hidden}
.deep-hero::after{
  content:"";position:absolute;right:-30px;top:-30px;width:190px;height:190px;border-radius:50%;
  border:26px solid rgba(228,190,58,.18);
}
.deep-hero .kicker{color:#B9CBD4}
.deep-hero h1{font-size:clamp(26px,3vw,38px);color:#fff;margin:10px 0 8px}
.deep-hero p{color:#B6C6CE;font-size:14px;max-width:70ch;position:relative;z-index:2}
.deep-hero .kpis{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.deep-hero .kpis div b{display:block;font-family:var(--mono);font-size:24px;color:var(--marker);line-height:1.2}
.deep-hero .kpis div span{font-size:11px;letter-spacing:.06em;color:#A9BCC5}

.acc{border:1px solid var(--line);border-radius:4px;background:var(--paper-2);overflow:hidden}
.acc + .acc{margin-top:10px}
.acc-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;text-align:left}
.acc-btn:hover{background:#F6F2E3}
.acc-btn .num{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:22px;flex:none}
.acc-btn .tt{flex:1;min-width:0}
.acc-btn .tt b{display:block;font-size:15px}
.acc-btn .tt em{font-style:normal;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.acc-btn .arw{width:16px;height:16px;stroke:var(--ink-3);transition:transform .2s ease;flex:none}
.acc.open .acc-btn .arw{transform:rotate(180deg)}
.acc-body{display:none;padding:2px 18px 20px;border-top:1px solid var(--line)}
.acc.open .acc-body{display:block}
.lead{font-size:13.5px;color:var(--ink-2);padding:14px 0 2px;line-height:1.75}
.kcard{padding:14px 0;border-bottom:1px solid var(--line)}
.kcard:last-child{border-bottom:none}
.kcard h5{font-size:13.5px;margin-bottom:4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kcard h5 em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:400}
.kcard p{font-size:13px;color:var(--ink-2);line-height:1.72}
.kcard ul{margin:6px 0 0;padding-left:18px;font-size:12.8px;color:var(--ink-2);line-height:1.7}
.kcard li{margin:2px 0}
.eg{font-size:12.3px;color:#4A513F;background:#F2EDD7;border-radius:2px;padding:7px 10px;margin-top:7px;line-height:1.65}
.eg b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#7A6520;margin-right:6px}

.rule{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:10px}
.rule div{background:var(--paper-2);padding:10px 12px}
.rule h6{margin:0 0 4px;font-size:10.5px;letter-spacing:.08em;font-family:var(--mono);color:var(--ink-3);font-weight:500}
.rule p{font-size:12.3px;line-height:1.65;color:var(--ink-2)}
.rule .do h6{color:var(--good)}
.rule .dont h6{color:var(--bad)}

.std-grid{display:flex;flex-direction:column;gap:10px}
.std{border:1px solid var(--line);background:var(--paper-2);border-radius:4px}
.std-h{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.std-h:hover{background:#F6F2E3}
.std-h .rom{font-family:var(--mono);font-size:12px;width:26px;height:26px;display:grid;place-items:center;background:var(--navy);color:#fff;border-radius:2px;flex:none}
.std-h b{font-size:14.5px;display:block}
.std-h em{font-style:normal;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.std-h .arw{width:15px;height:15px;stroke:var(--ink-3);margin-left:auto;transition:transform .2s}
.std.open .std-h .arw{transform:rotate(180deg)}
.std-b{display:none;padding:2px 16px 16px;border-top:1px solid var(--line)}
.std.open .std-b{display:block}
.sub-std{padding:12px 0;border-bottom:1px dashed var(--line)}
.sub-std:last-child{border-bottom:none}
.sub-std h6{margin:0 0 5px;font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sub-std h6 span{font-family:var(--mono);font-size:10.5px;color:var(--bad);border:1px solid #D8A79A;background:var(--bad-soft);padding:0 5px;border-radius:2px}
.sub-std h6 em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:400}
.sub-std p{font-size:12.7px;color:var(--ink-2);line-height:1.7}
.sub-std .row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;margin-top:5px;font-size:12.3px;line-height:1.65;color:var(--ink-2)}
.sub-std .row b{font-size:10.5px;letter-spacing:.04em;font-family:var(--mono);font-weight:500;padding-top:2px}
.sub-std .row.ok b{color:var(--good)}
.sub-std .row.no b{color:var(--bad)}

.trap-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.trap-item{border:1px solid var(--line);border-left:3px solid var(--bad);background:var(--paper-2);padding:12px 14px;border-radius:2px}
.trap-item b{font-family:var(--mono);font-size:10.5px;color:var(--bad);letter-spacing:.04em}
.trap-item p{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.65}

/* ===== 表格 ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.tbl th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.06em;font-family:var(--mono);color:var(--ink-3);border-bottom:1px solid var(--line-2);padding:8px 10px;background:var(--paper-3)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2);line-height:1.6}
.tbl tr:last-child td{border-bottom:none}

/* ===== 计算器 ===== */
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-family:var(--mono);color:var(--ink-3);letter-spacing:.04em}
.field input,.field select{
  padding:8px 10px;border:1px solid var(--line-2);background:#fff;border-radius:3px;
  font-family:var(--mono);font-size:13px;color:var(--ink);width:100%;
}
.calc-out{margin-top:14px;background:var(--navy);color:#EAF0F2;padding:14px 16px;border-radius:3px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.calc-out span{font-size:11px;letter-spacing:.08em;color:#9FB4BE;font-family:var(--mono)}
.calc-out b{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--marker)}

/* ===== 题库 ===== */
.quizbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);background:var(--paper-2);border-radius:4px}
.quizbar .left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.qcard{border:1px solid var(--line);background:var(--paper-2);border-radius:4px;box-shadow:var(--shadow);padding:26px 28px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.qtop .idx{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.qtop .sbj{font-family:var(--mono);font-size:11px;color:var(--navy-3);border:1px solid var(--line-2);padding:2px 7px}
.qstem{font-size:16px;line-height:1.8;font-weight:500;max-width:74ch}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.opt{
  display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;
  text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line-2);
  background:#fff;border-radius:3px;font-size:14px;line-height:1.6;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--navy-3);background:#FCFAF2}
.opt .bub{
  width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);
  display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;
}
.opt.sel{border-color:var(--navy);background:#F2F5F2}
.opt.sel .bub{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.expl{margin-top:18px;border-top:1px dashed var(--line-2);padding-top:16px;display:flex;gap:10px;flex-direction:column}
.expl .vd{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--good)}
.expl p{font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;flex-wrap:wrap}
.bubbles{display:flex;gap:5px;flex-wrap:wrap}
.bubbles i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);display:block;background:#fff}
.bubbles i.done{background:var(--navy);border-color:var(--navy)}
.bubbles i.cur{background:var(--marker);border-color:#B99A2A}
.bubbles i.err{background:var(--bad);border-color:var(--bad)}
.result{text-align:center;padding:34px 26px}
.score-big{font-family:var(--mono);font-size:clamp(54px,7vw,82px);font-weight:600;line-height:1;color:var(--navy);letter-spacing:-.04em}
.score-big small{font-size:18px;color:var(--ink-3);letter-spacing:0}
.result .verdict{font-size:17px;font-weight:700;margin:10px 0 6px}
.result .by{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:20px 0;max-width:520px;margin-left:auto;margin-right:auto}
.result .by div{background:var(--paper-2);padding:10px}
.result .by b{display:block;font-family:var(--mono);font-size:20px}
.result .by span{font-size:10.5px;color:var(--ink-3)}

/* ===== 公式卡 ===== */
.fgroup{border:1px solid var(--line);background:var(--paper-2);border-radius:4px;overflow:hidden;margin-bottom:12px}
.fgroup-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper-3);border-bottom:1px solid var(--line)}
.fgroup-h b{font-size:13px}
.fgroup-h em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:auto}
.frow{display:grid;grid-template-columns:minmax(180px,.9fr) minmax(0,1.5fr);gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.frow:last-child{border-bottom:none}
.frow .fn{font-size:12.5px;color:var(--ink-2)}
.frow .fn em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.frow .fv{font-family:var(--mono);font-size:12.5px;color:#2C3A22;background:#F5F1DF;padding:6px 10px;border-radius:2px;overflow-x:auto;white-space:nowrap}

/* ===== 错题本 ===== */
.mis{border:1px solid var(--line);background:var(--paper-2);border-left:3px solid var(--bad);padding:16px 18px;border-radius:2px;margin-bottom:10px}
.mis .mtop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:6px}
.mis .mstem{font-size:13.5px;font-weight:500;line-height:1.7}
.mis .mann{font-size:12.5px;color:var(--good);margin-top:6px}
.mis .mexp{font-size:12.3px;color:var(--ink-2);margin-top:6px;line-height:1.7}

.empty{border:1px dashed var(--line-2);padding:34px 22px;text-align:center;color:var(--ink-3);font-size:13px;border-radius:4px}

/* ===== 响应式 ===== */
@media (max-width:1080px){
  .hero{grid-template-columns:1fr}
  .hero-l{border-right:none;border-bottom:1px dashed var(--line-2)}
  .hero-l::after{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rule{grid-template-columns:1fr}
  .trap-list{grid-template-columns:1fr}
  .calc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{padding:34px 30px 80px}
}
@media (max-width:768px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;
    transform:translateX(-100%);transition:transform .24s ease;
  }
  .rail.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(12,36,54,.5);z-index:45;opacity:0;pointer-events:none;transition:opacity .24s}
  .scrim.on{opacity:1;pointer-events:auto}
  .menu-btn{display:flex}
  .main{padding:26px 18px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr;gap:6px}
  .day{grid-template-columns:54px minmax(0,1fr)}
  .day-rail .dnum{font-size:22px}
  .subj-head{grid-template-columns:6px minmax(0,1fr)}
  .subj-side{grid-column:2;align-items:flex-start;padding:0 20px 14px}
  .qcard{padding:20px 16px}
  .bubbles i{width:13px;height:13px}
  .bar-row{grid-template-columns:96px minmax(0,1fr) 50px}
  .bar-row .nm{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="brand-en">CFA · L1</div>
      <div class="brand-sub">Level I · Study desk</div>
    </div>
    <div class="rail-count"><b id="railDays">7</b><span>天<br>倒计时</span></div>
    <div class="rail-note" id="railDate">2026.11.16</div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      掌握度 <b id="railMastery">0%</b><br>
      已完成 <b id="railPoints">0</b> 个考点
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
  <button class="menu-btn" id="menuBtn" aria-label="打开导航">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>
<script>
/* =========================================================
   CFA Level I 一周冲刺工作台
   数据：2026 考纲 10 科权重 + 考点卡 + 题库 + 公式 + 7 日计划
   ========================================================= */

const SUBJECTS = [];
SUBJECTS.push({
id:'ethics', name:'Ethics', cn:'道德与职业准则', en:'Ethical and Professional Standards', weight:'15–20%', mid:17.5, weak:true,
summary:'七条准则 + GIPS + AMC。它不是“合规”，而是职业判断：该不该披露、客户是否优先、有没有独立判断。',
weakWhy:'国内合规训练解决“会不会被罚”，CFA 考“应当怎么做”。建议先背七条准则的英文标题与顺序，再用案例反推子准则。',
modules:[
{t:'准则体系与适用',en:'Framework',pts:[
{n:'准则适用于谁',en:'Members and Candidates',k:'你熟悉的是“公司员工手册 + 监管处罚”。CFA 这套准则管的是所有 members（含持证人）与 candidates，全球适用，且与本地监管并行。',b:'加入 CFA Institute 即承诺遵守；违反可能被吊销会员资格、候选人资格或使用 CFA 称号的权利。',trap:'以为“只管投资岗位”。研究、运营、销售、甚至考生本人都在管辖范围内。'},
{n:'更严格者优先',en:'More Strict Law or Standard',k:'国内思维常是“监管没禁止就能做”。CFA 是反过来的：法律与准则冲突时，遵守更严格的那一个。',b:'若当地法律要求的行为违反准则，不得据此违反准则；若准则更严，按准则执行。',trap:'把“当地合法”当作免责理由。'},
{n:'七条准则的记忆树',en:'Standards I–VII',k:'按“对谁负责”记：I 职业本身、II 市场、III 客户、IV 雇主、V 研究工作、VI 利益冲突、VII 协会与称号。',b:'I Professionalism；II Integrity of Capital Markets；III Duties to Clients；IV Duties to Employers；V Investment Analysis, Recommendations, and Actions；VI Conflicts of Interest；VII Responsibilities as a CFA Institute Member or Candidate。',f:'I 职业 · II 市场 · III 客户 · IV 雇主 · V 研究 · VI 冲突 · VII 称号',trap:'把 V（研究与建议）与 III（客户）混在一起，导致案例题选错责任对象。'},
{n:'道德决策框架',en:'Ethics Decision Framework',k:'国内实务往往“请示合规部”。CFA 要你先自查：事实、利益相关方、替代方案、公开后能否交代。',b:'识别事实与责任 → 识别冲突与伦理问题 → 收集信息 → 评估替代行动 → 执行 → 复盘反思。',trap:'直接跳到“怎么做”，不做替代方案比较。'},
{n:'Code 与 Standards 的分工',en:'Code of Ethics vs Standards',k:'Code 是价值观，Standards 是可执行的最低要求；案例题按 Standards 判违规。',b:'Code 六条总纲讲诚信、客户优先、独立判断、持续学习；Standards 把其拆成 22 条子准则。',trap:'用“动机是好的”为违反子准则辩护。'}
]},
{t:'准则 I–III · 对职业、市场与客户',en:'Standards I–III',pts:[
{n:'知法守法',en:'I(A) Knowledge of the Law',k:'国内合规强调“不违反本公司制度”。CFA 要求主动了解适用法律，且“不知情”不是抗辩。',b:'应了解并遵守管辖自己的法律、规则与准则；发现违规应脱离相关活动，必要时向合规或监管报告。',trap:'发现问题后“装作不知道”继续参与，属于独立违反。'},
{n:'独立与客观',en:'I(B) Independence and Objectivity',k:'卖方研报的“策略会 + 礼遇”在 CFA 眼里是潜在利益冲突。',b:'不得接受可能影响判断的礼物、招待或公司差旅；投行部门施压修改评级时，应拒绝或要求披露，无法保持独立则不署名。',trap:'认为“小额礼物没关系”而隐瞒不报。任何可能影响判断的安排都要向雇主披露。'},
{n:'虚假陈述',en:'I(C) Misrepresentation',k:'国内营销话术常用“稳健增值”“历史业绩优异”。CFA 对“保证收益”“摘樱桃式对比”零容忍。',b:'不得保证投资结果、不得只展示成功组合、不得把模型结果说成事实、不得抄袭他人研究。',trap:'引用业绩时只挑最好的基金或最好的年份，属于误导。'},
{n:'不当行为',en:'I(D) Misconduct',k:'“个人私德与工作无关”在 CFA 里不成立，只要损害职业声誉就算。',b:'不得参与欺诈、不诚实或损害职业声誉的行为；包括与职业能力相关的个人行为。',trap:'认为下班后的行为不受准则约束。'},
{n:'重大非公开信息',en:'II(A) Material Nonpublic Information',k:'国内讲“内幕信息”，CFA 的 MNPI 范围更宽：只要重大且未公开，来源不限。',b:'不得基于 MNPI 交易或促使他人交易；应促使信息公开后再操作；“马赛克理论”允许把非重大非公开信息与公开信息拼成结论。',f:'MNPI = material + nonpublic + 影响价格',trap:'把“非重大”信息当 MNPI 而完全不用；或反过来把重大信息拆成碎片规避。'},
{n:'市场操纵',en:'II(B) Market Manipulation',k:'A 股语境常说“拉抬股价”，CFA 区分交易型（实际买卖制造假象）与信息型（散布虚假信息）。',b:'不得通过交易或信息影响价格、制造虚假成交量或流动性。',trap:'只记住“不能造谣”，忽略“用交易制造虚假活跃度”也违规。'},
{n:'客户利益优先',en:'III(A) Loyalty, Prudence, and Care',k:'受托责任在 CFA 里高于公司销售指标；客户利益 > 雇主利益 > 个人利益。',b:'以客户利益为先，按 IPS 与授权行事，合理谨慎地管理资产。',trap:'为了完成公司销量而推荐不适合客户的产品。'},
{n:'公平对待',en:'III(B) Fair Dealing',k:'国内常“大客户先知道”。CFA 允许分级服务，但必须披露，且不能改变建议内容。',b:'给客户同等获取投资建议的机会；可以差异化服务，但不能让部分客户先于他人获得会改变决策的信息。',trap:'先给大客户打电话再给其他客户，且建议内容已变——这是典型的 order of presentation 违规。'},
{n:'适当性',en:'III(C) Suitability',k:'卖产品前先看 IPS：风险承受度、流动性、税务、期限。',b:'推荐前评估客户 IPS 与约束；条件变化时更新 IPS；组合偏离时及时沟通。',trap:'把“客户签字同意”当作适当性已经满足。'},
{n:'业绩呈报',en:'III(D) Performance Presentation',k:'国内宣传常用“成立以来年化”，忽略 survivorship bias。',b:'业绩呈报应公平、准确、完整，包含可比基准、费用与存活偏差说明；不得暗示过往业绩可复制。',trap:'只报告还在运营的组合，剔除清盘产品。'},
{n:'保密',en:'III(E) Preservation of Confidentiality',k:'客户信息保密，但有三个开口：违法活动、法律要求、CFA 协会调查。',b:'不得泄露现有、前任与潜在客户的信息；例外情形按法律与协会要求处理。',trap:'以为“离职后”客户信息就可以随意使用。'}
]},
{t:'准则 IV–VII · 对雇主、研究、冲突与称号',en:'Standards IV–VII',pts:[
{n:'对雇主的忠诚',en:'IV(A) Loyalty',k:'离职创业时带走客户名单、模型、数据库，在国内可能只是“灰色”，在 CFA 里直接违规。',b:'在职期间以雇主利益为重；离职前不得带走客户名单、保密信息；离职后可在不违反协议的前提下联系前客户。',trap:'把“客户是我开发的”当作可以带走的理由。'},
{n:'额外报酬',en:'IV(B) Additional Compensation Arrangements',k:'外部顾问费、讲课费、代持安排，都要书面向雇主披露并获同意。',b:'接受可能与雇主利益冲突的报酬前，须向雇主书面披露并取得同意。',trap:'先收钱后补披露，或只口头说一句。'},
{n:'监督责任',en:'IV(C) Responsibilities of Supervisors',k:'下属违规，主管不能以“不知情”免责；应有制度与检查。',b:'建立合规流程、培训与监督机制；发现违规应立即调查并采取措施。',trap:'认为“已发过合规邮件”就完成监督义务。'},
{n:'勤勉与合理依据',en:'V(A) Diligence and Reasonable Basis',k:'推荐要有独立依据，不能只是“转发卖方观点”。',b:'使用独立、充分的信息与模型；引用第三方研究要评估其合理性；团队协作时不能盲目署名。',trap:'把“公司统一模板”当作合理依据。'},
{n:'与客户沟通',en:'V(B) Communication with Clients',k:'推荐逻辑、风险、重大变更都要讲清楚，不能只给结论。',b:'区分事实与观点；披露重大模型或方法变更；说明固有风险与局限。',trap:'换模型后不告知客户，仍用旧业绩说话。'},
{n:'记录保存',en:'V(C) Record Retention',k:'国内留痕多为应付检查；CFA 要求记录足以支持投资建议。',b:'保存投资分析、建议与沟通记录；保存期限按当地法规，若无规定应保留足够长的时间以支持复核。',trap:'只留最终报告，丢掉假设、数据来源与模型版本。'},
{n:'利益冲突披露',en:'VI(A) Disclosure of Conflicts',k:'董事会席位、持股、亲属关系、卖方安排都要披露。',b:'向客户与雇主披露可能影响判断的利益关系，包括董事职务、持股与推荐费。',trap:'只在被问到时才披露。'},
{n:'交易优先顺序',en:'VI(B) Priority of Transactions',k:'客户 > 雇主 > 个人。热门 IPO 先给自己配额是典型违规。',b:'客户与雇主交易优先；个人交易不得利用职务信息，不得抢在客户之前。',trap:'把“我也只是小仓位”当作免责。'},
{n:'推荐费',en:'VI(C) Referral Fees',k:'引荐客户给第三方并收佣金，必须让客户与雇主都知道。',b:'向客户与雇主披露推荐费安排的性质与金额；不得隐藏。',trap:'把佣金说成“合作方服务费”而不披露。'},
{n:'考试与协会活动',en:'VII(A) Conduct as Participants',k:'泄露考题、代考、分享考试内容都违规。',b:'不得泄露 CFA 考题或考试内容，不得干扰考试秩序。',trap:'把“备考群里讨论考了什么”当作无害分享。'},
{n:'CFA 称号使用',en:'VII(B) Reference to Designation',k:'通过一级不等于持证人；可以说“CFA Level II Candidate”，不能说“CFA”。',b:'不得虚假宣称持有 CFA 称号或候选人身份；引用时应准确、完整。',trap:'简历写“CFA（在读）”或“CFA Level 3”，属于虚假陈述。'}
]},
{t:'GIPS 与资管合规',en:'GIPS & Asset Manager Code',pts:[
{n:'GIPS 的定位',en:'Global Investment Performance Standards',k:'它不是会计准则是业绩报告标准；不是个人准则是公司标准；不是强制是自愿。',b:'公司可自愿采用；合规声明只能 firm-wide 作出；用于向潜在客户呈现可比的业绩记录。',f:'GIPS = 公司层面 + 自愿 + 业绩报告',trap:'以为某个组合可以单独宣称“GIPS compliant”。'},
{n:'Composite 的构成',en:'Composite',k:'Composite 不是“精选组合”，而是把同策略、同授权的所有实际付费组合都放进去。',b:'composite 应包含所有 actual、fee-paying、discretionary 组合；不得只挑业绩好的放进去。',trap:'剔除表现差的组合，或把非付费模拟组合混入。'},
{n:'GIPS 最低披露',en:'Required Disclosures',k:'至少五年，之后逐年增加到十年；需披露 composite 资产、公司总资产、费用口径、基准。',b:'业绩须至少展示 5 年（或自成立以来），并逐步累积到 10 年；必须披露基准与费率影响。',trap:'只展示最近一年的好业绩。'},
{n:'AMC 的定位',en:'Asset Manager Code of Professional Conduct',k:'Code 管“人”，GIPS 管“数字”，AMC 管“公司制度”。',b:'六块：道德守则、治理、利益冲突、合规与控制、业绩与估值、披露。',trap:'把 AMC 当作个人必须遵守的准则；它针对公司。'}
]}]});

{t:'货币与财政政策',en:'Monetary & Fiscal Policy',b:'货币乘数不是 1/rr，而是 (1+c)/(rr+er+c)：现金漏出与超额准备金都会缩小乘数。公开市场操作调节基础货币，是最常用工具；提高准备金率降低乘数。财政乘数 1/[1−MPC(1−t)]，税率与进口漏出使其变小；自动稳定器（累进税、失业救济）无需立法即逆周期；政府借贷推高利率会挤出私人投资。',f:'m=(1+c)/(rr+er+c)；fiscal multiplier=1/[1−MPC(1−t)]',keys:['money multiplier','open market operations','fiscal multiplier','crowding out','automatic stabilizer'],exam:'计算题给 rr、er、c 三个数，必须三个都用上；只除 rr 是典型错误。'},
{t:'国际收支与汇率平价',en:'Balance of Payments & FX Parity',b:'BOP 经常账户 + 资本账户 + 金融账户，恒等接近零，一国逆差必然对应资本/金融账户流入。四套关系：利率平价（covered：F/S=(1+id)/(1+if)，高利率货币远期贴水）；购买力平价（高通胀国货币长期贬值）；Fisher 国际效应（名义利率差反映预期通胀）；汇率超调（短期利率冲击导致过度调整）。实际汇率 = 名义 × 外国物价/本国物价。',f:'F/S=(1+id)/(1+if)；RER=S×Pf/Pd',keys:['current account','covered interest rate parity','purchasing power parity','real exchange rate','overshooting'],exam:'“高利率货币远期是升水还是贴水”答贴水，方向题几乎每年出现。'},
{t:'增长与周期',en:'Growth & Business Cycle',b:'长期增长来自资本深化、人力资本、技术与制度，生产函数 Y=A·f(K,L)；仅靠资本积累会遇到边际递减。周期四阶段：扩张、峰值、收缩、谷底；领先指标包括股价、建筑许可、利差、初请失业金，失业率与通胀是滞后指标。',keys:['capital deepening','total factor productivity','leading indicator','business cycle'],exam:'“哪个是领先指标”用排除法：失业率、CPI 一定是滞后。'},
{t:'贸易与关税',en:'Trade & Tariffs',b:'比较优势看机会成本而不是绝对成本，双方按各自机会成本更低的产品专业化都能获益。关税提高进口品价格、保护国内生产者，但消费者剩余损失大于生产者剩余增加，形成无谓损失；配额效果类似但租金归属不同；贸易集团有贸易创造与贸易转移。',keys:['comparative advantage','opportunity cost','quota','trade creation','trade diversion'],exam:'“绝对成本都更低的国家还需要贸易吗”答需要，因为比较优势。'}

/* ===== 状态与工具 ===== */
const LS = 'cfa7.';
const state = {
  mastered: new Set(JSON.parse(localStorage.getItem(LS+'mastered') || '[]')),
  tasks: new Set(JSON.parse(localStorage.getItem(LS+'tasks') || '[]')),
  wrong: JSON.parse(localStorage.getItem(LS+'wrong') || '[]'),
  attempts: JSON.parse(localStorage.getItem(LS+'attempts') || '[]'),
  examDate: localStorage.getItem(LS+'examDate') || '2026-11-14',
  openSubjects: new Set(),
  openAcc: new Set(),
  openStd: new Set(),
  libFilter: 'all',
  libQuery: '',
  quiz: {mode:'idle', set:[], idx:0, picks:[], filter:'all', limit:20, revealed:false}
};
function save(){
  localStorage.setItem(LS+'mastered', JSON.stringify([...state.mastered]));
  localStorage.setItem(LS+'tasks', JSON.stringify([...state.tasks]));
  localStorage.setItem(LS+'wrong', JSON.stringify(state.wrong));
  localStorage.setItem(LS+'attempts', JSON.stringify(state.attempts.slice(-40)));
  localStorage.setItem(LS+'examDate', state.examDate);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function daysLeft(){
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(state.examDate+'T00:00:00');
  return Math.max(0, Math.ceil((d - now) / 86400000));
}
function fmtDate(s){ if(!s) return '—'; return s.replaceAll('-','.'); }
function datePlus(n){
  const d = new Date(state.examDate+'T00:00:00');
  d.setDate(d.getDate() - (5 - n));
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return m + '.' + day;
}
function allPoints(){
  const out = [];
  SUBJECTS.forEach(s => s.modules.forEach((m,mi) => m.pts.forEach((p,pi) => {
    out.push({id:s.id+'-'+mi+'-'+pi, sub:s.id, subName:s.cn, title:p.n, en:p.en, body:p.b, formula:p.f, trap:p.trap});
  })));
  return out;
}
function pointStats(){
  const all = allPoints();
  const done = all.filter(p => state.mastered.has(p.id)).length;
  return {total:all.length, done, pct: all.length ? Math.round(done/all.length*100) : 0};
}
function subjPoints(s){
  let total = 0, done = 0;
  s.modules.forEach((m,mi)=>m.pts.forEach((p,pi)=>{
    total++; if(state.mastered.has(s.id+'-'+mi+'-'+pi)) done++;
  }));
  return {total, done, pct: total ? Math.round(done/total*100) : 0};
}
function taskStats(){
  let total=0, done=0;
  PLAN.forEach(d=>d.tasks.forEach((t,i)=>{ total++; if(state.tasks.has('d'+d.n+'-'+i)) done++; }));
  return {total, done, pct: total?Math.round(done/total*100):0};
}
function quizStats(){
  if(!state.attempts.length) return {acc:null, n:0};
  const sums = state.attempts.reduce((a,x)=>({c:a.c+x.c, n:a.n+x.n}),{c:0,n:0});
  return {acc: sums.n?Math.round(sums.c/sums.n*100):null, n:sums.n};
}
function daysElapsed(){ return 7 - daysLeft(); }
function todayIndex(){
  const d = daysLeft();
  return Math.min(5, Math.max(1, 6 - d));
}
function activeDay(){
  for(const d of PLAN){
    if(d.tasks.some((t,i)=>!state.tasks.has('d'+d.n+'-'+i))) return d;
  }
  return PLAN[PLAN.length-1];
}

function pointModules(s, q){
  return s.modules.map((m,mi)=>{
    const pts = m.pts.filter(p=>!q || (p.n+' '+p.en+' '+p.b+' '+(p.f||'')+' '+(p.trap||'')).toLowerCase().includes(q));
    if(!pts.length) return '';
    return '<div class="module"><h4>'+esc(m.t)+'<em>'+esc(m.en||'')+'</em></h4>'+
      '<div class="pts">'+pts.map(p=>{
        const pi = m.pts.indexOf(p);
        const id = s.id+'-'+mi+'-'+pi;
        const on = state.mastered.has(id);
        return '<div class="pt">'+
          '<div><h5>'+esc(p.n)+'<em>'+esc(p.en||'')+'</em></h5>'+
          '<p>'+esc(p.b)+'</p>'+
          (p.k?'<div class="eg" style="margin-top:6px"><b>迁移</b>'+esc(p.k)+'</div>':'')+
          (p.f?'<div class="fml">'+esc(p.f)+'</div>':'')+
          (p.trap?'<div class="trap"><b>易错</b><span>'+esc(p.trap)+'</span></div>':'')+
          '</div>'+
          '<div class="pt-ctl"><button class="dotbtn'+(on?' on':'')+'" data-action="toggle-point" data-id="'+id+'" aria-label="标记掌握">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'+
          '</button><small>'+(on?'已掌握':'标记')+'</small></div>'+
        '</div>';
      }).join('')+'</div></div>';
  }).join('');
}

  const total = GLOSSARY.reduce((a,g)=>a+g.items.length,0);
  const shown = groups.reduce((a,g)=>a+g.items.filter(t=>!q||(t.en+' '+t.cn+' '+t.note).toLowerCase().includes(q)).length,0);
  return ''+
  '<div class="kicker">Terminology · EN / CN</div>'+
  '<h1 class="page">重点术语表</h1>'+
  '<p class="lede">'+total+' 个一级高频词。每个词给三样东西：英文原词、中文对应、以及<span class="mark">CFA 口径与实务口径的差别</span>。概念题失分，多半不是不懂，而是不认词。</p>'+
  '<div class="quizbar" style="margin-top:20px">'+
    '<div class="left">'+
      '<div class="chips">'+
        '<button class="chip'+(state.termFilter==='all'?' on':'')+'" data-action="term-filter" data-id="all">全部</button>'+
        GLOSSARY.map(g=>'<button class="chip'+(state.termFilter===g.key?' on':'')+'" data-action="term-filter" data-id="'+g.key+'">'+esc(g.name)+'</button>').join('')+
      '</div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;align-items:center">'+
      '<input id="termSearch" type="search" placeholder="按英文或中文搜…" value="'+esc(state.termQuery)+'" style="padding:7px 10px;border:1px solid var(--line-2);background:#fff;border-radius:3px;font-size:12.5px;min-width:200px">'+
      '<span class="mono" style="font-size:11px;color:var(--ink-3)">'+shown+'</span>'+
    '</div>'+
  '</div>'+
  '<div style="margin-top:18px">'+
    groups.map(g=>{
      const items = g.items.filter(t=>!q||(t.en+' '+t.cn+' '+t.note).toLowerCase().includes(q));
      if(!items.length) return '';
      return '<div class="fgroup"><div class="fgroup-h"><b>'+esc(g.name)+'</b><em>'+esc(g.en)+' · '+items.length+'</em></div>'+
        items.map(t=>'<div class="frow" style="grid-template-columns:minmax(150px,.7fr) minmax(0,2fr)">'+
          '<div class="fn"><b style="font-size:13px;color:var(--ink)">'+esc(t.en)+'</b><em>'+esc(t.cn)+'</em></div>'+
          '<div style="font-size:12.4px;color:var(--ink-2);line-height:1.7">'+esc(t.note)+'</div></div>').join('')+
      '</div>';
    }).join('')+
  '</div>'+
  (shown===0?'<div class="empty">没有命中，试试 duration、GIPS、basis、composite。</div>':'');
}

/* ===== 题库 ===== */
function pageQuiz(){
  const mode = state.quiz.mode;
  if(mode==='run') return quizRun();
  if(mode==='done') return quizDone();
  return quizStart();
}
function quizStart(){
  const qs = quizStats();
  const counts = {};
  QUIZ.forEach(q=>counts[q.s]=(counts[q.s]||0)+1);
  const subs = SUBJECTS.filter(s=>counts[s.id]);
  const filt = state.quiz.filter;
  const pool = filt==='all' ? QUIZ : QUIZ.filter(q=>q.s===filt);
  const n = Math.min(state.quiz.limit, pool.length);
  return ''+
  '<div class="kicker">Question bank</div>'+
  '<h1 class="page">题库训练</h1>'+
  '<p class="lede">'+QUIZ.length+' 道三选一模拟题，按真实考法写题干（most likely / least likely）。每题都有解析，答错自动进错题本。</p>'+
  '<div class="card card-pad" style="margin-top:22px">'+
    '<div class="grid g4" style="gap:16px">'+
      '<div><div class="kicker">题库总量</div><div class="mono" style="font-size:26px;font-weight:600;color:var(--navy)">'+QUIZ.length+'</div><span class="hint">题</span></div>'+
      '<div><div class="kicker">累计正确率</div><div class="mono" style="font-size:26px;font-weight:600;color:var(--navy)">'+(qs.acc===null?'—':qs.acc+'%')+'</div><span class="hint">'+qs.n+' 题</span></div>'+
      '<div><div class="kicker">错题本</div><div class="mono" style="font-size:26px;font-weight:600;color:var(--bad)">'+state.wrong.length+'</div><span class="hint">待清</span></div>'+
      '<div><div class="kicker">本次</div><div class="mono" style="font-size:26px;font-weight:600;color:var(--navy)">'+n+'</div><span class="hint">题</span></div>'+
    '</div>'+
    '<div class="divider"></div>'+
    '<div class="kicker" style="margin-bottom:9px">选择科目</div>'+
    '<div class="chips">'+
      '<button class="chip'+(filt==='all'?' on':'')+'" data-action="quiz-filter" data-id="all">全部科目</button>'+
      subs.map(s=>'<button class="chip'+(filt===s.id?' on':'')+'" data-action="quiz-filter" data-id="'+s.id+'">'+esc(s.cn)+' · '+(counts[s.id])+'</button>').join('')+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap">'+
      '<select id="quizLimit" style="padding:8px 10px;border:1px solid var(--line-2);background:#fff;border-radius:3px;font-size:12.5px">'+
        [10,20,30,60].map(v=>'<option value="'+v+'"'+(state.quiz.limit===v?' selected':'')+'>'+v+' 题/组</option>').join('')+
      '</select>'+
      '<button class="btn marker" data-action="quiz-start">开始答题</button>'+
      '<span class="hint">不扣分、不限时，但建议按 90 秒/题计时。</span>'+
    '</div>'+
  '</div>'+
  '<div class="card card-pad" style="margin-top:16px">'+
    '<div class="card-head"><h3>三科的题感校准</h3><span class="tag">先做这段</span></div>'+
    '<div class="grid g3" style="gap:18px">'+
      '<div><b style="font-size:13px">Ethics 占比最高</b><p class="hint" style="margin-top:4px">题干里的“most appropriate”往往只有一个选项同时满足披露与客户优先。先找“是否披露、是否书面、是否客户优先”。</p></div>'+
      '<div><b style="font-size:13px">FSA 爱考差异</b><p class="hint" style="margin-top:4px">同一条业务，在 IFRS 与 US GAAP 下的处理不同；题干默认 IFRS，出现 US GAAP 会明说。</p></div>'+
      '<div><b style="font-size:13px">计算题先估方向</b><p class="hint" style="margin-top:4px">久期、汇率、货币乘数都可先判断增减方向，再选唯一匹配的数值，能省一半时间。</p></div>'+
    '</div>'+
  '</div>';
}
function quizRun(){
  const q = state.quiz;
  const item = q.set[q.idx];
  const sub = SUBJECTS.find(s=>s.id===item.s);
  const picked = q.picks[q.idx];
  return ''+
  '<div class="quizbar">'+
    '<div class="left"><span class="mono" style="font-size:11px;color:var(--ink-3)">'+esc(sub?sub.cn:item.s)+'</span>'+
    '<span class="mono" style="font-size:11px;color:var(--ink-3)">'+item.id+'</span></div>'+
    '<div class="bubbles">'+q.set.map((x,i)=>'<i class="'+(i===q.idx?'cur':(q.picks[i]!==undefined?'done':'')+(q.picks[i]!==undefined&&q.picks[i]!==x.a?' err':''))+'"></i>').join('')+'</div>'+
    '<button class="btn ghost sm" data-action="quiz-quit">退出</button>'+
  '</div>'+
  '<div class="qcard" style="margin-top:14px">'+
    '<div class="qtop"><span class="idx">QUESTION '+(q.idx+1)+' / '+q.set.length+'</span><span class="sbj">'+esc(item.s.toUpperCase())+'</span></div>'+
    '<div class="qstem">'+esc(item.q)+'</div>'+
    '<div class="opts">'+
      item.o.map((o,i)=>{
        let cls = '';
        if(q.revealed){
          if(i===item.a) cls=' right';
          else if(i===picked) cls=' wrong';
        } else if(i===picked) cls=' sel';
        return '<button class="opt'+cls+'" data-action="pick" data-id="'+i+'"><span class="bub">'+'ABC'[i]+'</span><span>'+esc(o)+'</span></button>';
      }).join('')+
    '</div>'+
    (q.revealed?'<div class="expl"><span class="vd">'+(picked===item.a?'CORRECT · 正确':'WRONG · 正确选项 '+('ABC'[item.a]))+'</span>'+
      '<p>'+esc(item.e)+'</p></div>':'')+
    '<div class="qfoot">'+
      '<span class="hint">'+(q.revealed?'已记录，进入下一题':'选择一个答案后立即出解析')+'</span>'+
      (q.revealed?'<button class="btn marker" data-action="quiz-next">'+(q.idx+1>=q.set.length?'看结果':'下一题')+'</button>':'<span></span>')+
    '</div>'+
  '</div>';
}
function quizDone(){
  const q = state.quiz;
  const correct = q.set.reduce((a,x,i)=>a+(q.picks[i]===x.a?1:0),0);
  const n = q.set.length;
  const acc = Math.round(correct/n*100);
  const verdict = acc>=80?'这一组稳了，换科或加量。':acc>=60?'及格线附近，错题必须当天清。':'先回考点卡，再回来重刷。';
  return ''+
  '<div class="kicker">Result</div>'+
  '<h1 class="page">本组结果</h1>'+
  '<div class="qcard" style="margin-top:18px">'+
    '<div class="result">'+
      '<div class="score-big">'+acc+'<small>%</small></div>'+
      '<div class="verdict">'+verdict+'</div>'+
      '<p class="hint">答对 '+correct+' / '+n+' 题，错题已进错题本（'+state.wrong.length+' 条待清）。</p>'+
      '<div class="by">'+
        '<div><b>'+correct+'</b><span>答对</span></div>'+
        '<div><b>'+(n-correct)+'</b><span>错题</span></div>'+
        '<div><b>'+n+'</b><span>本组</span></div>'+
      '</div>'+
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
        '<button class="btn marker" data-action="quiz-again">再来一组</button>'+
        '<a class="btn ghost" href="#/mistakes">去清错题</a>'+
        '<a class="btn ghost" href="#/quiz">换科目</a>'+
      '</div>'+
    '</div>'+
  '</div>';
}

  '<div style="margin-top:24px">'+
    FORMULAS.map(g=>'<div class="fgroup">'+
      '<div class="fgroup-h"><b>'+esc(g.g)+'</b><em>'+esc(g.en)+' · '+g.items.length+'</em></div>'+
      g.items.map(it=>'<div class="frow">'+
        '<div class="fn">'+esc(it.n)+'<em>'+esc(it.en)+'</em></div>'+
        '<div class="fv">'+esc(it.f)+'</div></div>').join('')+
    '</div>').join('')+
  '</div>'+
  '<div class="card card-pad" style="margin-top:12px">'+
    '<div class="card-head"><h3>易混公式对照</h3><span class="tag weak">高频</span></div>'+
    '<table class="tbl">'+
      '<tr><th style="width:26%">容易混</th><th style="width:37%">公式</th><th>区别</th></tr>'+
      '<tr><td>Sharpe / Treynor</td><td class="mono">(Rp−Rf)/σp ｜ (Rp−Rf)/βp</td><td>分母是总风险还是系统性风险。</td></tr>'+
      '<tr><td>Macauley / Modified</td><td class="mono">D_mod = D_mac/(1+y/k)</td><td>久期是年数还是价格弹性。</td></tr>'+

      '<tr><td>FCFE / FCFF</td><td class="mono">NI+NCC−FCInv−WCInv+NB ｜ EBIT(1−t)+NCC−FCInv−WCInv</td><td>前者给股东，后者给全体资本提供者。</td></tr>'+
    '</table>'+
  '</div>';

/* ===== 错题本 ===== */
function pageMistakes(){
  const ids = state.wrong.slice().reverse();
  const items = ids.map(id=>QUIZ.find(q=>q.id===id)).filter(Boolean);
  return ''+
  '<div class="kicker">Review</div>'+
  '<h1 class="page">错题本</h1>'+
  '<p class="lede">所有答错自动记录。清题标准不是“看懂解析”，而是<span class="mark">能说出错在哪个判断条件</span>。当天、隔天、考前各刷一遍。</p>'+
  '<div style="margin-top:20px">'+
    (items.length? items.map(it=>'<div class="mis">'+
      '<div class="mtop"><span class="mono" style="font-size:10.5px;color:var(--ink-3)">'+it.id+' · '+esc((SUBJECTS.find(s=>s.id===it.s)||{}).cn||it.s)+'</span>'+
      '<button class="btn ghost sm" data-action="clear-mis" data-id="'+it.id+'">标记已清</button></div>'+
      '<div class="mstem">'+esc(it.q)+'</div>'+
      '<div class="mann">正确：'+'ABC'[it.a]+'. '+esc(it.o[it.a])+'</div>'+
      '<div class="mexp">'+esc(it.e)+'</div>'+
    '</div>').join('') : '<div class="empty">还没有错题。去 <a href="#/quiz" style="color:var(--navy);border-bottom:1px solid var(--navy)">题库</a> 刷一组，错的会自动进来。</div>')+
  '</div>';
}

/* ===== 计算器 ===== */
function runCalc(kind){
  const g = id=>parseFloat(document.getElementById(id).value);
  const out = (id,val)=>document.getElementById(id).querySelector('b').textContent = val;
  if(kind==='fx'){
    const v = g('fxNom') * g('fxCpiF') / g('fxCpiD');
    out('fxOut', isFinite(v)? v.toFixed(4) : '—');
  } else if(kind==='mm'){
    const rr=g('mmRr'), er=g('mmEr'), c=g('mmC');
    const v = (1+c)/(rr+er+c);
    out('mmOut', isFinite(v)? v.toFixed(2) : '—');
  } else if(kind==='dur'){
    const D=g('durD'), bp=g('durY')/10000, C=g('durC');
    const v = (-D*bp + 0.5*C*bp*bp)*100;
    out('durOut', isFinite(v)? (v>0?'+':'')+v.toFixed(3)+'%' : '—');
  } else if(kind==='fisher'){
    const nom=g('fNom'), inf=g('fInf');
    const v = (1+nom)/(1+inf)-1;
    out('fisherOut', isFinite(v)? (v*100).toFixed(2)+'%' : '—');
  }
}

/* ===== 路由与事件 ===== */
let focusId = null;
let lastRoute = null;

function hashParams(){
  const parts = location.hash.split('?');
  const out = {};
  if(parts[1]){
    parts[1].split('&').forEach(p=>{
      const kv = p.split('=');
      out[kv[0]] = decodeURIComponent(kv[1] || '');
    });
  }
  return out;
}

function render(){
  const r = route();
  const map = {
    home: pageHome, cram: pageCram, plan: pagePlan, library: pageLibrary,
    econ: pageEcon, ethics: pageEthics, quiz: pageQuiz,
    terms: pageTerms, formulas: pageFormulas, mistakes: pageMistakes
  };
  const p = hashParams();
  if(r==='quiz' && p.subject) state.quiz.filter = p.subject;
  if(r==='library' && p.subject) state.openSubjects.add(p.subject);
  state.termFilter = state.termFilter || 'all';
  state.termQuery = state.termQuery || '';
  state.libQuery = state.libQuery || '';
  const page = r.indexOf('subject/')===0 ? ()=>pageSubject(r.split('/')[1]) : (map[r] || pageHome);
  document.getElementById('main').innerHTML = page();
  renderNav();
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      const v = el.value;
      el.value = '';
      el.value = v;
    }
    focusId = null;
  } else if(lastRoute !== r){
    window.scrollTo(0, 0);
  }
  lastRoute = r;
  const nm = r.indexOf('subject/')===0
    ? ((SUBJECTS.find(x=>'subject/'+x.id===r)||{}).cn || '十科教材')
    : ((ROUTES.find(x=>x.id===r)||{}).label || '总览');
  document.title = 'CFA Level I · ' + nm;
}

function rerender(){ render(); }

document.getElementById('main').addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.getAttribute('data-action');
  const id = t.getAttribute('data-id');

  if(a==='toggle-point'){
    if(state.mastered.has(id)) state.mastered.delete(id); else state.mastered.add(id);
    save(); rerender();
  } else if(a==='toggle-subject'){
    if(state.openSubjects.has(id)) state.openSubjects.delete(id); else state.openSubjects.add(id);
    rerender();
  } else if(a==='toggle-acc'){
    if(state.openAcc.has(id)) state.openAcc.delete(id); else state.openAcc.add(id);
    rerender();
  } else if(a==='toggle-std'){
    if(state.openStd.has(id)) state.openStd.delete(id); else state.openStd.add(id);
    rerender();
  } else if(a==='lib-filter'){
    state.libFilter = id; rerender();
  } else if(a==='term-filter'){
    state.termFilter = id; rerender();
  } else if(a==='quiz-filter'){
    state.quiz.filter = id; state.quiz.mode = 'idle'; rerender();
  } else if(a==='quiz-start'){
    const pool = state.quiz.filter==='all' ? QUIZ.slice() : QUIZ.filter(q=>q.s===state.quiz.filter);
    state.quiz.set = shuffle(pool).slice(0, Math.min(state.quiz.limit, pool.length));
    state.quiz.idx = 0;
    state.quiz.picks = [];
    state.quiz.revealed = false;
    state.quiz.mode = 'run';
    rerender();
  } else if(a==='pick'){
    const q = state.quiz;
    if(q.revealed) return;
    const i = Number(id);
    q.picks[q.idx] = i;
    q.revealed = true;
    if(i !== q.set[q.idx].a){
      const qid = q.set[q.idx].id;
      state.wrong = [qid].concat(state.wrong.filter(x=>x!==qid));
    }
    save(); rerender();
  } else if(a==='quiz-next'){
    const q = state.quiz;
    if(q.idx + 1 >= q.set.length){
      const c = q.set.reduce((s,x,ix)=>s + (q.picks[ix]===x.a?1:0), 0);
      state.attempts.push({c:c, n:q.set.length, t:Date.now()});
      save();
      q.mode = 'done';
    } else {
      q.idx += 1;
      q.revealed = false;
    }
    rerender();
  } else if(a==='quiz-quit'){
    state.quiz.mode = 'idle'; rerender();
  } else if(a==='quiz-again'){
    state.quiz.mode = 'idle'; rerender();
  } else if(a==='clear-mis'){
    state.wrong = state.wrong.filter(x=>x!==id);
    save(); rerender();
  } else if(a==='calc'){
    runCalc(t.getAttribute('data-kind'));
  } else if(a==='go-subject'){
    state.openSubjects.add(id);
    if(route()==='library'){ rerender(); } else { location.hash = '#/library'; }
  }
});

document.getElementById('main').addEventListener('change', function(e){
  if(e.target.matches('[data-task]')){
    const id = e.target.getAttribute('data-task');
    if(e.target.checked) state.tasks.add(id); else state.tasks.delete(id);
    save(); rerender();
  } else if(e.target.id==='examDate'){
    if(e.target.value){ state.examDate = e.target.value; save(); rerender(); }
  } else if(e.target.id==='quizLimit'){
    state.quiz.limit = Number(e.target.value); rerender();
  }
});

document.getElementById('main').addEventListener('input', function(e){
  if(e.target.id==='libSearch'){
    state.libQuery = e.target.value;
    focusId = 'libSearch';
    rerender();
  } else if(e.target.id==='termSearch'){
    state.termQuery = e.target.value;
    focusId = 'termSearch';
    rerender();
  }
});

const rail = document.getElementById('rail');
const scrim = document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click', function(){
  rail.classList.add('open'); scrim.classList.add('on');
});
scrim.addEventListener('click', function(){

  const a = e.target.closest('a');

  if(state.examDate === '2026-11-16'){ state.examDate = '2026-11-14'; save(); }

  state.termQuery = '';

})();
